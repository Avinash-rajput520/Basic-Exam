<!doctype html> 
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"> 
<title>Future Computer Centre - Basic Exam</title>
<link rel="stylesheet" href="style.css">
<style>
  .logo-img { width: 50px; height: 50px; border-radius: 4px; object-fit: contain; }
  .examtop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .q-palette { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 15px; margin-bottom: 15px; }
  .q-btn { width: 35px; height: 35px; border: 1px solid #ccc; background: #f0f0f0; cursor: pointer; border-radius: 3px; font-weight: bold; }
  .q-btn.active { border: 2px solid #007bff; background: #e7f1ff; }
  .q-btn.answered { background: #28a745; color: white; border-color: #28a745; }
</style>
</head> 
<body>
<div class="wrap"> 
<header style="display:flex; align-items:center; gap:15px;">
  <!-- Integrated Library Logo -->
  <img class="logo-img" src="library.jpeg" alt="Library Logo">
  <div>
    <h1>Future Computer Centre</h1>
    <p>Basic Computer Examination</p>
  </div>
</header> 

<section id="start" class="card"> 
<h2>Student Registration</h2>
<p class="muted">50 Questions • 60 Minutes • Passing: 40% (20 Marks)</p> 
<div class="grid">
  <label>Student Name<input id="name" required></label>
  <label>Father/Mother Name<input id="parent" required></label> 
  <label>Roll No.<input id="roll" required></label>
  <label>Mobile No.<input id="mobile"></label>
</div> 
<button onclick="startExam()">Start Exam</button>
<p id="err" class="error"></p> 
</section> 

<section id="exam" class="card hidden">
  <div class="examtop">
    <span id="progress"></span>
    <strong id="timer">60:00</strong>
  </div> 
  <div id="question"></div>
  
  <!-- Question Palette for 50 Qs -->
  <div id="palette" class="q-palette"></div>

  <div class="nav">
    <button id="prev" onclick="prevQ()">Previous</button>
    <button id="next" onclick="nextQ()">Next</button>
    <button id="submit" class="danger" onclick="submitExam()">Submit Exam</button>
  </div>
</section> 

<section id="result" class="card hidden"></section> 
</div> 

<script> 
const questions = [
  // Computer Basics
  {"q": "What does CPU stand for?", "options": ["Central Processing Unit", "Computer Personal Unit", "Central Program Utility", "Control Processing User"], "answer": 0},
  {"q": "Which device is mainly used to type text?", "options": ["Monitor", "Keyboard", "Speaker", "Printer"], "answer": 1},
  {"q": "Which of these is an output device?", "options": ["Mouse", "Keyboard", "Monitor", "Scanner"], "answer": 2},
  {"q": "What is the full form of RAM?", "options": ["Read Access Memory", "Random Access Memory", "Run Access Memory", "Rapid Action Memory"], "answer": 1},
  {"q": "Which shortcut key is used to Copy selected text?", "options": ["Ctrl + X", "Ctrl + C", "Ctrl + V", "Ctrl + Z"], "answer": 1},
  {"q": "Which shortcut key is used to Paste?", "options": ["Ctrl + P", "Ctrl + V", "Ctrl + S", "Ctrl + A"], "answer": 1},
  {"q": "What is the shortcut key to Save a file?", "options": ["Ctrl + S", "Ctrl + D", "Ctrl + W", "Ctrl + F"], "answer": 0},
  {"q": "Which key is used to delete characters to the left of the cursor?", "options": ["Delete", "Backspace", "Shift", "Tab"], "answer": 1},
  {"q": "What is the full form of ROM?", "options": ["Read Only Memory", "Random Only Memory", "Run Operating Memory", "Real Output Module"], "answer": 0},
  {"q": "Which device provides temporary power backup to a PC?", "options": ["UPS", "CPU", "RAM", "Hard Disk"], "answer": 0},

  // MS Paint
  {"q": "What is the primary extension for files saved in MS Paint?", "options": [".png", ".docx", ".xlsx", ".pptx"], "answer": 0},
  {"q": "Which tool in MS Paint is used to fill color in a closed shape?", "options": ["Pencil", "Fill with color (Bucket)", "Brush", "Eraser"], "answer": 1},
  {"q": "Which tool in MS Paint allows you to zoom in on a photo?", "options": ["Magnifier", "Text Tool", "Color Picker", "Selection"], "answer": 0},
  {"q": "Which key combination is used to Undo an action in MS Paint?", "options": ["Ctrl + Y", "Ctrl + Z", "Ctrl + X", "Ctrl + A"], "answer": 1},
  {"q": "Which tool is used to write text in MS Paint?", "options": ["Pencil", "Text Tool (A)", "Brush", "Curve"], "answer": 1},
  {"q": "Which shape tool is used to draw perfect circles in Paint while holding Shift?", "options": ["Rectangle", "Oval", "Line", "Polygon"], "answer": 1},
  {"q": "What happens when you press Ctrl + N in MS Paint?", "options": ["Opens a new page", "Saves the file", "Prints the page", "Closes Paint"], "answer": 0},
  {"q": "Which color is selected as 'Color 1' in MS Paint?", "options": ["Background Color", "Foreground/Drawing Color", "Transparent Color", "Eraser Color"], "answer": 1},
  {"q": "Which tool allows freehand drawing in MS Paint?", "options": ["Pencil", "Rectangle", "Line", "Fill Color"], "answer": 0},
  {"q": "Can you insert 3D shapes directly in basic MS Paint?", "options": ["Yes", "No", "Only on Sundays", "With Ctrl key"], "answer": 1},

  // MS Word (WinWord)
  {"q": "What is the executable file name to open MS Word from Run dialog?", "options": ["msword.exe", "winword.exe", "word.exe", "wordpad.exe"], "answer": 1},
  {"q": "What is the default extension of MS Word 2007 and later files?", "options": [".docx", ".doc", ".txt", ".rtf"], "answer": 0},
  {"q": "Which shortcut key is used to Select All text in MS Word?", "options": ["Ctrl + A", "Ctrl + S", "Ctrl + Alt + A", "Shift + A"], "answer": 0},
  {"q": "Which alignment sets text evenly between left and right margins?", "options": ["Align Left", "Center", "Align Right", "Justify"], "answer": 3},
  {"q": "Which key is used to check Spelling and Grammar in MS Word?", "options": ["F5", "F7", "F12", "F2"], "answer": 1},
  {"q": "What is the shortcut key to Bold selected text?", "options": ["Ctrl + B", "Ctrl + I", "Ctrl + U", "Ctrl + Shift + B"], "answer": 0},
  {"q": "Which feature in MS Word automatically moves text to the next line?", "options": ["Word Wrap", "Line Wrap", "Text Shift", "Auto Paragraph"], "answer": 0},
  {"q": "What is the shortcut to open the Print Preview dialog?", "options": ["Ctrl + P", "Ctrl + F2", "Alt + P", "Both A and B"], "answer": 3},
  {"q": "Which view displays the document as it will appear when printed?", "options": ["Draft View", "Web Layout", "Print Layout", "Outline View"], "answer": 2},
  {"q": "Which feature is used to send the same letter to multiple recipients?", "options": ["Mail Merge", "Macro", "Cross-reference", "Track Changes"], "answer": 0},

  // MS Excel
  {"q": "What is the intersection of a column and a row in Excel called?", "options": ["Square", "Cell", "Box", "Block"], "answer": 1},
  {"q": "Every formula in MS Excel must begin with which symbol?", "options": ["+", "@", "=", "#"], "answer": 2},
  {"q": "What is the standard file extension for MS Excel workbooks?", "options": [".xlsx", ".xlsb", ".doc", ".pdf"], "answer": 0},
  {"q": "Which function is used to add values in a range of cells?", "options": ["ADD()", "TOTAL()", "SUM()", "COUNT()"], "answer": 2},
  {"q": "How are columns identified in MS Excel?", "options": ["Numbers (1, 2, 3)", "Letters (A, B, C)", "Roman numerals", "Symbols"], "answer": 1},
  {"q": "What is the total default sheet count in newer Excel versions?", "options": ["1", "3", "5", "10"], "answer": 0},
  {"q": "Which formula is correct to calculate average of cells A1 to A5?", "options": ["=AVG(A1:A5)", "=AVERAGE(A1:A5)", "=SUM(A1:A5)/AVG", "=MEAN(A1:A5)"], "answer": 1},
  {"q": "What shortcut key opens the 'Format Cells' dialog box in Excel?", "options": ["Ctrl + 1", "Ctrl + F", "Alt + F1", "Shift + F11"], "answer": 0},
  {"q": "Which key is pressed to edit the active cell in Excel?", "options": ["F2", "F4", "F7", "F11"], "answer": 0},
  {"q": "Which chart type is best for showing trends over time?", "options": ["Pie Chart", "Line Chart", "Bar Chart", "Scatter Plot"], "answer": 1},

  // MS PowerPoint
  {"q": "What is an individual page in a PowerPoint presentation called?", "options": ["Page", "Sheet", "Slide", "Document"], "answer": 2},
  {"q": "What is the shortcut key to start a slideshow from the beginning?", "options": ["F5", "Shift + F5", "F1", "F12"], "answer": 0},
  {"q": "Which shortcut key starts a slideshow from the current slide?", "options": ["F5", "Shift + F5", "Ctrl + F5", "Alt + F5"], "answer": 1},
  {"q": "What is the default extension of PowerPoint presentations?", "options": [".pptx", ".ppt", ".pdf", ".docx"], "answer": 0},
  {"q": "Which effect is applied to control how slides enter during presentation?", "options": ["Animation", "Slide Transition", "Custom Show", "Design Layout"], "answer": 1},
  {"q": "Which key stops an active slideshow in PowerPoint?", "options": ["Esc", "Enter", "Spacebar", "Backspace"], "answer": 0},
  {"q": "Which pane displays miniature versions of all slides in presentation?", "options": ["Slide Sorter View / Thumbnail Pane", "Notes Pane", "Task Pane", "Outline View"], "answer": 0},
  {"q": "What is the shortcut key to insert a New Slide in PowerPoint?", "options": ["Ctrl + N", "Ctrl + M", "Ctrl + S", "Ctrl + K"], "answer": 1},
  {"q": "Which tab contains options for slide themes and color schemes?", "options": ["Insert", "Design", "Transitions", "View"], "answer": 1},
  {"q": "Which view is used to give speeches while viewing speaker notes?", "options": ["Presenter View", "Reading View", "Slide Show", "Master View"], "answer": 0}
];

let current = 0;
let answers = Array(questions.length).fill(null);
let seconds = 3600; // 60 minutes
let timerId = null;
let student = {};

function startExam(){ 
  student = {
    name: document.getElementById('name').value.trim(),
    parent: document.getElementById('parent').value.trim(),
    roll: document.getElementById('roll').value.trim(),
    mobile: document.getElementById('mobile').value.trim()
  }; 
  if(!student.name || !student.parent || !student.roll){
    document.getElementById('err').textContent = 'Please fill Student Name, Father/Mother Name and Roll No.';
    return;
  } 
  document.getElementById('start').classList.add('hidden'); 
  document.getElementById('exam').classList.remove('hidden'); 
  render(); 
  timerId = setInterval(tick, 1000); 
} 

function tick(){
  seconds--;
  let m = Math.floor(seconds/60), s = seconds%60;
  document.getElementById('timer').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if(seconds <= 0) submitExam(true);
} 

function render(){
  let x = questions[current];
  document.getElementById('progress').textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById('question').innerHTML = `<h2>${current+1}. ${x.q}</h2>` + 
    x.options.map((o,i) => `
      <label class="option">
        <input type="radio" name="opt" value="${i}" ${answers[current]===i?'checked':''} onchange="selectOpt(${i})"> ${o}
      </label>`).join('');
  
  document.getElementById('prev').disabled = (current === 0);
  document.getElementById('next').disabled = (current === questions.length-1);
  
  renderPalette();
}

function selectOpt(idx){
  answers[current] = idx;
  renderPalette();
}

function renderPalette(){
  let p = document.getElementById('palette');
  p.innerHTML = questions.map((_, i) => `
    <button class="q-btn ${i===current ? 'active' : ''} ${answers[i]!==null ? 'answered' : ''}" onclick="goToQ(${i})">${i+1}</button>
  `).join('');
}

function goToQ(index){
  current = index;
  render();
}

function prevQ(){ if(current > 0){ current--; render(); } } 
function nextQ(){ if(current < questions.length - 1){ current++; render(); } } 

function submitExam(auto = false){
  if(timerId) clearInterval(timerId);
  let score = answers.reduce((n, a, i) => n + (a === questions[i].answer ? 1 : 0), 0);
  let pct = (score / questions.length) * 100;
  
  localStorage.setItem('fcc_result', JSON.stringify({
    student, score, pct, answers, date: new Date().toLocaleDateString('en-IN')
  }));
  
  document.getElementById('exam').classList.add('hidden');
  let pass = pct >= 40;
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('result').innerHTML = `
    <div class="resultbox">
      <h2>Exam Result</h2>
      <h1>${score} / ${questions.length}</h1>
      <p>Percentage: <b>${pct.toFixed(2)}%</b></p>
      <h2 class="${pass ? 'pass' : 'fail'}">${pass ? 'PASS' : 'FAIL'}</h2>
      <p><b>${student.name}</b><br>Roll No: ${student.roll}</p>
      ${pass ? '<button onclick="printCertificate()">Generate Certificate</button>' : ''}
      <button class="secondary" onclick="location.reload()">New Exam</button>
    </div>`;
} 

function printCertificate(){
  let r = JSON.parse(localStorage.getItem('fcc_result'));
  if(!r || r.pct < 40){
    alert('Certificate is available only for students who pass.');
    return;
  }
  window.open('certificate.html', '_blank');
} 
</script>
</body>
</html>
