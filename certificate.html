<!doctype html><html><head><meta charset="utf-8"><title>Certificate - Future Computer Centre</title>
<style>@page{size:A4 landscape;margin:0}body{margin:0;background:#ddd;font-family:Georgia,serif}.cert{width:297mm;height:210mm;background:#fff;margin:auto;padding:14mm;border:12px solid #13233f;outline:3px solid #c99b3b;outline-offset:-22px;text-align:center;position:relative}.small{font-family:Arial;color:#555}.title{font-size:44px;letter-spacing:5px;color:#13233f;margin:18px 0}.name{font-size:38px;text-transform:uppercase;border-bottom:2px solid #13233f;display:inline-block;padding:5px 45px}.course{font-size:25px;margin:18px}.meta{font-family:Arial;display:flex;justify-content:space-between;margin-top:45px;padding:0 35px}.sig{font-family:cursive;font-size:25px;border-top:1px solid #333;padding-top:5px;min-width:180px}.seal{position:absolute;left:50%;bottom:30mm;transform:translateX(-50%);border:3px solid #c99b3b;border-radius:50%;padding:14px;font-family:Arial;font-size:11px;color:#8a681d}.no-print{font-family:Arial;text-align:center;margin:15px}@media print{.no-print{display:none}} </style></head>
<body><div class="no-print"><button onclick="window.print()">Print / Save as PDF</button></div><div class="cert">
<div class="small">FUTURE COMPUTER CENTRE</div><div class="title">CERTIFICATE</div><div class="small">OF COMPLETION</div><p>This is to certify that</p><div class="name" id="name">Student Name</div>
<p class="course">has successfully completed the <b>Basic Computer Examination</b></p><p id="details"></p><div class="seal">FUTURE<br>COMPUTER<br>CENTRE</div>
<div class="meta"><div><div id="date"></div><div class="small">Date</div></div><div><div class="sig">Jitender Singh</div><div class="small">Authorized Signatory</div></div><div><div id="certno"></div><div class="small">Certificate No.</div></div></div>
</div><script>let r=JSON.parse(localStorage.getItem('fcc_result')||'null');if(!r||r.pct<40){document.getElementById('details').textContent='No valid passing result found.'}else{document.getElementById('name').textContent=r.student.name;document.getElementById('details').innerHTML=`Roll No: <b>${r.student.roll}</b> &nbsp; | &nbsp; Percentage: <b>${r.pct.toFixed(2)}%</b>`;document.getElementById('date').textContent=r.date;document.getElementById('certno').textContent='FCC-'+new Date().getFullYear()+'-'+r.student.roll}}</script></body></html>
